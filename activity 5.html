<html>
    <head>
        <title>
            list
        </title>
    </head>
    <body>
        <center><h1>lists</h1></center>
        <h1>unordered list</h1>
        <ul type="circle">
            <li>pen</li>
            <li>pencil</li>
            <li>marker</li>
        </ul>
        <h1>ordered list</h1>
        <ol type="a">
            <li>pen</li>
            <li>pencil</li>
            <li>marker</li>
        </ol>
        <h1>defination list</h1>
        <dl>
            <dt>pen</dt>
            <dd>used to write</dd>
            <dt>pencil</dt>
            <dd>used to write</dd>
        </dl>
    </body>
</html>
